name: Inspect
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          git clone https://github.com/devendrn/RenderDragonSourceCodeInv
          cd RenderDragonSourceCodeInv
          bash setup.sh
          ls -R | head -400
